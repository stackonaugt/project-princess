# Publishes the game to GitHub Pages every time main changes.
# One-off setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: List custom sprites
        run: node tools/build-manifest.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest lib src assets icons _site/
          rm -rf _site/assets/sprites/templates
          find _site/assets -name '*.md' -delete
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
